name: Bug report
description: Report a problem with the project
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit hash or release tag you are running
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (search / download / media)
        - Frontend (UI / watch party)
        - Watch sync (SSE)
        - Deployment (docker / systemd / nginx)
        - Docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste backend/frontend logs, error traces, or screenshots.
