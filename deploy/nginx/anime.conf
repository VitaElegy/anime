server {
    listen 80;
    server_name _;

    root /srv/anime/app/frontend/dist;
    index index.html;

    # ─── SSE: never buffer the Watch Room event stream ──────────────────
    # FastAPI already sends ``X-Accel-Buffering: no`` but belt-and-braces:
    # pin the location block so no upstream timeout kills the socket mid-
    # stream. We keep the generic /api/ block below for everything else.
    location ~ ^/api/watch/rooms/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    # ─── HLS segments served straight off disk ──────────────────────────
    # Bypassing FastAPI here matters because each HLS chunk is a real HTTP
    # request and Python's GIL under StaticFiles would cap throughput.
    location /media/hls/ {
        alias /srv/anime/app/data/streams/hls/;
        try_files $uri =404;

        # Let browsers cache segments for a while — their filenames include
        # a segment index so updates never collide.
        add_header Cache-Control "public, max-age=3600";
        # m3u8 playlists must NOT be cached aggressively; they mutate as
        # transcodes progress.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache";
        }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
