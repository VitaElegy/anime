[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nicotracker-anime"
version = "0.1.0"
description = "Self-hosted anime resource tracker, downloader and watch-party server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VitaElegy" }]
keywords = ["anime", "fastapi", "react", "watch-party", "torrent", "bangumi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
# Keep in sync with requirements.txt.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "cryptography>=42.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "qbittorrent-api>=2024.2",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",      # line length handled by formatter
    "B008",      # FastAPI style: function calls in defaults (Query, Depends)
    "SIM108",    # ternary readability is fine in this codebase
    "SIM117",    # nested with is more readable here
]
